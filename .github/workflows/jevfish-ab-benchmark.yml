name: JevFish A/B benchmark

on:
  workflow_dispatch:
    inputs:
      agents:
        description: Number of synthetic agents
        required: true
        default: "10"
      rounds:
        description: OASIS simulation rounds
        required: true
        default: "3"
      threshold:
        description: Base confidence threshold for cheap Jev actions
        required: true
        default: "0.58"
      generative_threshold:
        description: Confidence threshold for quote/comment/create-post actions
        required: true
        default: "0.72"
      max_actions:
        description: Maximum actions per agent per tick
        required: true
        default: "3"
  push:
    branches: [main]
    paths:
      - tests/.run-jevfish-v02

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      TYPESAFE_DEFAULT_MODEL: jev-latest
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://openrouter.ai/api/v1
      LLM_MODEL_NAME: meta/muse-spark-1.3-contributor
      JEVFISH_GENERATIVE_CONFIDENCE_THRESHOLD: ${{ inputs.generative_threshold || '0.72' }}
      JEVFISH_TARGET_CONFIDENCE_THRESHOLD: ${{ inputs.threshold || '0.58' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JevFish runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Validate provider secrets
        shell: bash
        run: |
          test -n "$TYPESAFE_API_KEY" || (echo "TYPESAFE_API_KEY is required" >&2; exit 1)
          test -n "$LLM_API_KEY" || (echo "LLM_API_KEY is required" >&2; exit 1)

      - name: Run controlled A/B benchmark
        run: |
          python benchmarks/jevfish_ab.py \
            --agents "${{ inputs.agents || '5' }}" \
            --rounds "${{ inputs.rounds || '1' }}" \
            --threshold "${{ inputs.threshold || '0.58' }}" \
            --max-actions "${{ inputs.max_actions || '3' }}" \
            --output jevfish-ab-report.json

      - name: Publish benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jevfish-ab-report
          path: jevfish-ab-report.json
          if-no-files-found: warn
