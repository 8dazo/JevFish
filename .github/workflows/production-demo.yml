name: Production demo checks

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "render.yaml"
      - ".env.example"
      - "backend/app/**"
      - "backend/wsgi.py"
      - "backend/requirements.txt"
      - "frontend/**"
      - ".github/workflows/production-demo.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "render.yaml"
      - ".env.example"
      - "backend/app/**"
      - "backend/wsgi.py"
      - "backend/requirements.txt"
      - "frontend/**"
      - ".github/workflows/production-demo.yml"

permissions:
  contents: read

jobs:
  static-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compile production Python entrypoints
        run: |
          python -m py_compile \
            backend/wsgi.py \
            backend/app/config.py \
            backend/app/__init__.py \
            backend/app/api/system.py
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
