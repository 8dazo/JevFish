name: JevFish repeated trials

on:
  workflow_dispatch:
    inputs:
      agents:
        description: Number of synthetic agents
        required: true
        default: "5"
      rounds:
        description: OASIS simulation rounds per arm
        required: true
        default: "1"
      trials:
        description: Number of paired hybrid/LLM trials
        required: true
        default: "3"
      seed:
        description: Base local/OASIS seed
        required: true
        default: "42"
      threshold:
        description: Base confidence threshold for cheap Jev actions
        required: true
        default: "0.58"
      generative_threshold:
        description: Confidence threshold for language-heavy actions
        required: true
        default: "0.72"
      max_actions:
        description: Maximum actions per agent per tick
        required: true
        default: "3"
  push:
    branches: [main]
    paths:
      - tests/.run-jevfish-repeated

permissions:
  contents: read

jobs:
  repeated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      TYPESAFE_DEFAULT_MODEL: jev-latest
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://openrouter.ai/api/v1
      LLM_MODEL_NAME: meta/muse-spark-1.3-contributor
      JEVFISH_OBSERVATION_MODE: oasis_refresh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JevFish runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Validate provider secrets
        shell: bash
        run: |
          test -n "$TYPESAFE_API_KEY" || (echo "TYPESAFE_API_KEY is required" >&2; exit 1)
          test -n "$LLM_API_KEY" || (echo "LLM_API_KEY is required" >&2; exit 1)

      - name: Run paired repeated trials
        run: |
          python benchmarks/repeated_trials.py \
            --agents "${{ inputs.agents || '5' }}" \
            --rounds "${{ inputs.rounds || '1' }}" \
            --trials "${{ inputs.trials || '3' }}" \
            --seed "${{ inputs.seed || '42' }}" \
            --threshold "${{ inputs.threshold || '0.58' }}" \
            --generative-threshold "${{ inputs.generative_threshold || '0.72' }}" \
            --max-actions "${{ inputs.max_actions || '3' }}" \
            --output jevfish-repeated-trials.json

      - name: Publish repeated-trial report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jevfish-repeated-trials
          path: jevfish-repeated-trials.json
          if-no-files-found: warn
