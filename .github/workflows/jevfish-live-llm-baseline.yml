name: JevFish live OASIS LLM baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-oasis-llm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://openrouter.ai/api/v1
      LLM_MODEL_NAME: meta/muse-spark-1.3-contributor
      JEVFISH_DECISION_ENGINE: llm
      JEVFISH_OASIS_LLM_REPORT: jevfish-oasis-llm-live.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JevFish runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Validate OpenRouter secret
        shell: bash
        run: |
          test -n "$LLM_API_KEY" || (echo "LLM_API_KEY is required" >&2; exit 1)

      - name: Run production OASIS Muse Spark baseline
        run: python tests/live_jevfish_oasis_llm.py

      - name: Publish baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jevfish-oasis-llm-live
          path: jevfish-oasis-llm-live.json
          if-no-files-found: warn
