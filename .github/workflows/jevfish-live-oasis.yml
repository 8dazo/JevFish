name: JevFish live OASIS integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-oasis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      TYPESAFE_DEFAULT_MODEL: jev-latest
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://openrouter.ai/api/v1
      LLM_MODEL_NAME: meta/muse-spark-1.3-contributor
      JEVFISH_DECISION_ENGINE: hybrid
      JEVFISH_SAMPLE_PROBABILITIES: "false"
      JEVFISH_CONFIDENCE_THRESHOLD: "0.0"
      JEVFISH_OASIS_REPORT: jevfish-oasis-live.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JevFish runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Validate provider secrets
        shell: bash
        run: |
          test -n "$TYPESAFE_API_KEY" || (echo "TYPESAFE_API_KEY is required" >&2; exit 1)
          test -n "$LLM_API_KEY" || (echo "LLM_API_KEY is required" >&2; exit 1)

      - name: Run production JevFish OASIS simulation
        run: python tests/live_jevfish_oasis.py

      - name: Publish integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jevfish-oasis-live
          path: jevfish-oasis-live.json
          if-no-files-found: warn
