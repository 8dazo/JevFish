name: JevFish threshold calibration

on:
  workflow_dispatch:
    inputs:
      agents:
        description: Number of synthetic agents
        required: true
        default: "5"
      rounds:
        description: OASIS simulation rounds
        required: true
        default: "1"
      base_threshold:
        description: Confidence threshold for cheap behavioral actions
        required: true
        default: "0.58"
      generative_thresholds:
        description: Comma-separated thresholds for quote/comment/create-post
        required: true
        default: "0.68,0.72,0.76"
      max_actions:
        description: Maximum actions per agent per tick
        required: true
        default: "3"
  push:
    branches: [main]
    paths:
      - tests/.run-jevfish-calibration

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      TYPESAFE_DEFAULT_MODEL: jev-latest
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://openrouter.ai/api/v1
      LLM_MODEL_NAME: meta/muse-spark-1.3-contributor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JevFish runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Validate provider secrets
        shell: bash
        run: |
          test -n "$TYPESAFE_API_KEY" || (echo "TYPESAFE_API_KEY is required" >&2; exit 1)
          test -n "$LLM_API_KEY" || (echo "LLM_API_KEY is required" >&2; exit 1)

      - name: Sweep generative thresholds
        run: |
          python benchmarks/calibrate_thresholds.py \
            --agents "${{ inputs.agents || '5' }}" \
            --rounds "${{ inputs.rounds || '1' }}" \
            --base-threshold "${{ inputs.base_threshold || '0.58' }}" \
            --generative-thresholds "${{ inputs.generative_thresholds || '0.68,0.72,0.76' }}" \
            --max-actions "${{ inputs.max_actions || '3' }}" \
            --output jevfish-calibration-report.json

      - name: Publish calibration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jevfish-calibration-report
          path: jevfish-calibration-report.json
          if-no-files-found: warn
