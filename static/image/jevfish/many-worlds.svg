<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">JevFish many-worlds simulation</title>
  <desc id="desc">A branching simulation tree showing one initial world splitting into many stochastic futures whose outcomes are summarized as simulation frequencies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#10152a"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#62e6ff"/><stop offset="1" stop-color="#7a84ff"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7f86ff"/><stop offset="1" stop-color="#d86dff"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#90b5d8" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="650" rx="26" fill="url(#grid)"/>

  <text x="58" y="68" fill="#f5f9ff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="800">Many possible worlds</text>
  <text x="58" y="102" fill="#829ab8" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="17">Run the same initial society repeatedly and measure which outcomes keep emerging.</text>

  <g font-family="Inter,ui-sans-serif,system-ui,sans-serif">
    <rect x="64" y="238" width="230" height="145" rx="22" fill="#0d1b2a" stroke="#38516d"/>
    <text x="88" y="270" fill="#6885a3" font-size="12" font-weight="800" letter-spacing="1.3">INITIAL WORLD</text>
    <text x="88" y="307" fill="#eff7ff" font-size="21" font-weight="800">Same seed, same agents</text>
    <text x="88" y="338" fill="#a8bfd6" font-size="14">One event. One social graph.</text>
    <text x="88" y="364" fill="#a8bfd6" font-size="14">Different stochastic micro-decisions.</text>

    <rect x="414" y="151" width="176" height="90" rx="18" fill="#0b2130" stroke="#62e6ff" stroke-opacity=".45"/>
    <text x="438" y="182" fill="#78edff" font-size="12" font-weight="800" letter-spacing="1.1">ROLLOUT 01</text>
    <text x="438" y="214" fill="#eafbff" font-size="17" font-weight="800">positive cascade</text>

    <rect x="414" y="280" width="176" height="90" rx="18" fill="#131b36" stroke="#8387ff" stroke-opacity=".48"/>
    <text x="438" y="311" fill="#a9abff" font-size="12" font-weight="800" letter-spacing="1.1">ROLLOUT 02</text>
    <text x="438" y="343" fill="#efefff" font-size="17" font-weight="800">mixed response</text>

    <rect x="414" y="409" width="176" height="90" rx="18" fill="#23152f" stroke="#d66eff" stroke-opacity=".45"/>
    <text x="438" y="440" fill="#eca9ff" font-size="12" font-weight="800" letter-spacing="1.1">ROLLOUT 03</text>
    <text x="438" y="472" fill="#fff0ff" font-size="17" font-weight="800">backlash emerges</text>

    <text x="635" y="190" fill="#6d87a3" font-size="12" font-weight="800" letter-spacing="1.1">... HUNDREDS MORE ...</text>

    <rect x="758" y="154" width="376" height="346" rx="24" fill="#0c1827" stroke="#354b65"/>
    <text x="786" y="188" fill="#6d87a3" font-size="12" font-weight="800" letter-spacing="1.3">OUTCOME FREQUENCIES</text>
    <text x="786" y="226" fill="#eff6ff" font-size="23" font-weight="800">Across repeated simulations</text>

    <g font-size="14" fill="#b4c9dd">
      <text x="786" y="282">pricing dominates discussion</text>
      <text x="786" y="352">open-source backlash emerges</text>
      <text x="786" y="422">competitor response appears</text>
    </g>
    <g>
      <rect x="786" y="298" width="300" height="16" rx="8" fill="#14273a"/>
      <rect x="786" y="298" width="201" height="16" rx="8" fill="url(#a)"/>
      <text x="1100" y="311" text-anchor="end" fill="#90eaf7" font-size="13" font-weight="800">67%</text>

      <rect x="786" y="368" width="300" height="16" rx="8" fill="#14273a"/>
      <rect x="786" y="368" width="93" height="16" rx="8" fill="url(#b)"/>
      <text x="1100" y="381" text-anchor="end" fill="#c8a6ff" font-size="13" font-weight="800">31%</text>

      <rect x="786" y="438" width="300" height="16" rx="8" fill="#14273a"/>
      <rect x="786" y="438" width="66" height="16" rx="8" fill="#69d4d1"/>
      <text x="1100" y="451" text-anchor="end" fill="#8ee9e5" font-size="13" font-weight="800">22%</text>
    </g>
  </g>

  <g fill="none" stroke-linecap="round" stroke-width="3">
    <path d="M294 308C348 308 350 196 397 196" stroke="#62e6ff" stroke-opacity=".55"/>
    <path d="M294 310C350 310 352 325 397 325" stroke="#8488ff" stroke-opacity=".55"/>
    <path d="M294 313C349 313 351 454 397 454" stroke="#d66eff" stroke-opacity=".5"/>
    <path d="M590 196C669 196 676 292 735 292" stroke="#62e6ff" stroke-opacity=".25"/>
    <path d="M590 325C675 325 682 325 735 325" stroke="#8488ff" stroke-opacity=".25"/>
    <path d="M590 454C670 454 680 359 735 359" stroke="#d66eff" stroke-opacity=".25"/>
  </g>
  <g fill="#6b88a8"><path d="M389 189l14 7-14 7z"/><path d="M389 318l14 7-14 7z"/><path d="M389 447l14 7-14 7z"/><path d="M727 285l14 7-14 7z"/><path d="M727 318l14 7-14 7z"/><path d="M727 352l14 7-14 7z"/></g>

  <rect x="61" y="535" width="1073" height="58" rx="18" fill="#0b1724" stroke="#27394d"/>
  <text x="86" y="558" fill="#f0f6ff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800">Important</text>
  <text x="86" y="580" fill="#7f97b2" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13">These are simulation frequencies, not calibrated real-world probabilities unless validated against real observations.</text>

  <rect x="1" y="1" width="1198" height="648" rx="25" fill="none" stroke="#9edcff" stroke-opacity=".07" stroke-width="2"/>
</svg>