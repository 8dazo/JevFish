<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">JevFish — System-One Swarm Simulation</title>
  <desc id="desc">A dark futuristic JevFish banner showing a school of agent nodes moving through a fast System-One decision field into branching possible futures.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63e6ff"/>
      <stop offset="0.5" stop-color="#7c83ff"/>
      <stop offset="1" stop-color="#d96cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6fe7ff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#6fe7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="smallGlow"><feGaussianBlur stdDeviation="4"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#86a8d4" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="28" fill="url(#grid)"/>
  <ellipse cx="900" cy="250" rx="280" ry="230" fill="url(#glow)" filter="url(#blur)"/>

  <g opacity=".85">
    <path d="M690 126 C790 118 815 170 902 171 C982 172 1010 125 1104 119" fill="none" stroke="#6ae7ff" stroke-opacity=".22" stroke-width="2"/>
    <path d="M690 219 C786 214 835 250 905 254 C985 260 1025 225 1118 236" fill="none" stroke="#8b8cff" stroke-opacity=".25" stroke-width="2"/>
    <path d="M690 318 C785 320 822 287 906 292 C1003 297 1031 359 1110 374" fill="none" stroke="#d66cff" stroke-opacity=".23" stroke-width="2"/>
  </g>

  <g transform="translate(70 62)">
    <rect x="0" y="0" width="76" height="32" rx="16" fill="#0e2238" stroke="#6fe7ff" stroke-opacity=".5"/>
    <circle cx="18" cy="16" r="4" fill="#6fe7ff"/>
    <text x="31" y="21" fill="#bdefff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">JEV</text>

    <text x="0" y="98" fill="#f6fbff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="72" font-weight="800" letter-spacing="-3">JevFish</text>
    <text x="2" y="139" fill="#9db2cf" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="500">System-One swarm simulation.</text>
    <text x="2" y="174" fill="#9db2cf" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="500">Fast micro-decisions. Many possible worlds.</text>

    <g transform="translate(0 226)">
      <rect width="172" height="44" rx="22" fill="url(#accent)"/>
      <text x="86" y="28" text-anchor="middle" fill="#07111f" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="800">JEV → ACTION</text>
      <rect x="188" width="192" height="44" rx="22" fill="#0e1b2b" stroke="#273c57"/>
      <text x="284" y="28" text-anchor="middle" fill="#d9e7f8" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">LLM → LANGUAGE</text>
    </g>

    <g transform="translate(0 312)" font-family="Inter,ui-sans-serif,system-ui,sans-serif">
      <text x="0" y="0" fill="#607a99" font-size="13" font-weight="700" letter-spacing="1.1">DECISION LOOP</text>
      <text x="0" y="35" fill="#e7f3ff" font-size="16">ignore · like · repost · follow · react · branch</text>
    </g>
  </g>

  <g transform="translate(730 98)">
    <text x="0" y="0" fill="#6d88a9" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">SWARM STATE</text>

    <g fill="none" stroke-linecap="round">
      <path d="M14 83 C77 22 165 23 226 69 C263 97 306 98 344 79" stroke="#62e8ff" stroke-width="3" stroke-opacity=".55"/>
      <path d="M19 166 C88 115 163 138 209 171 C255 203 297 205 355 170" stroke="#8788ff" stroke-width="3" stroke-opacity=".52"/>
      <path d="M32 245 C110 217 151 243 207 264 C264 285 309 286 364 252" stroke="#d773ff" stroke-width="3" stroke-opacity=".48"/>
    </g>

    <g fill="#0e2032" stroke-width="2">
      <circle cx="15" cy="83" r="10" stroke="#63e6ff"/><circle cx="80" cy="42" r="8" stroke="#63e6ff"/><circle cx="147" cy="45" r="7" stroke="#63e6ff"/><circle cx="225" cy="69" r="9" stroke="#63e6ff"/><circle cx="344" cy="79" r="11" stroke="#63e6ff"/>
      <circle cx="19" cy="166" r="8" stroke="#888cff"/><circle cx="92" cy="133" r="11" stroke="#888cff"/><circle cx="161" cy="145" r="7" stroke="#888cff"/><circle cx="209" cy="171" r="9" stroke="#888cff"/><circle cx="355" cy="170" r="10" stroke="#888cff"/>
      <circle cx="32" cy="245" r="9" stroke="#d773ff"/><circle cx="112" cy="224" r="7" stroke="#d773ff"/><circle cx="207" cy="264" r="11" stroke="#d773ff"/><circle cx="364" cy="252" r="9" stroke="#d773ff"/>
    </g>

    <g fill="#ecf8ff">
      <circle cx="344" cy="79" r="3"/><circle cx="355" cy="170" r="3"/><circle cx="364" cy="252" r="3"/>
    </g>

    <path d="M388 76 C425 76 435 51 462 35" stroke="#63e6ff" stroke-opacity=".6" fill="none" stroke-width="2"/>
    <path d="M389 170 C431 170 438 170 470 170" stroke="#8c8cff" stroke-opacity=".6" fill="none" stroke-width="2"/>
    <path d="M389 252 C427 252 443 281 468 302" stroke="#d773ff" stroke-opacity=".6" fill="none" stroke-width="2"/>

    <g font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">
      <rect x="454" y="14" width="112" height="42" rx="12" fill="#0d2230" stroke="#63e6ff" stroke-opacity=".4"/>
      <text x="510" y="40" text-anchor="middle" fill="#a9f3ff">WORLD A</text>
      <rect x="462" y="149" width="112" height="42" rx="12" fill="#151b35" stroke="#888cff" stroke-opacity=".45"/>
      <text x="518" y="175" text-anchor="middle" fill="#c9caff">WORLD B</text>
      <rect x="458" y="281" width="112" height="42" rx="12" fill="#24152e" stroke="#d773ff" stroke-opacity=".42"/>
      <text x="514" y="307" text-anchor="middle" fill="#efc3ff">WORLD C</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="518" rx="27" fill="none" stroke="#9ad9ff" stroke-opacity=".08" stroke-width="2"/>
</svg>